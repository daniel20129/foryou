<!DOCTYPE html>
<html>
<head>
  <title>Para mi amor ❤️</title>

  <style>
    body {
      background-color: pink;
      text-align: center;
      font-family: Arial;
      margin-top: 100px;
    }

    .corazon {
      font-size: 100px;
      animation: latido 1s infinite;
    }

    @keyframes latido {
      0%   { transform: scale(1); }
      25%  { transform: scale(2.3); }
      50%  { transform: scale(2); }
      75%  { transform: scale(3.5); }
      90% { transform: scale(0.2); }
    }
  </style>
</head>

<body>
    
    
    

<h1>Te Amo Muchísimo ❤️</h1>

<div class="corazon">❤️</div>

<h2>Eres la mejor novia del mundo 🌸</h2>

</body>
</html>
